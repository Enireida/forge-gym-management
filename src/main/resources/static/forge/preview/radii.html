<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-canvas);font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .swatch{width:80px;height:80px;background:var(--sage-700);border:1px solid var(--sage-800);}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);}
  .val{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
</style></head>
<body>
<div class="grid">
  <div class="item"><div class="swatch" style="border-radius:4px"></div><div class="lbl">--r-xs</div><div class="val">4px</div></div>
  <div class="item"><div class="swatch" style="border-radius:8px"></div><div class="lbl">--r-sm</div><div class="val">8px</div></div>
  <div class="item"><div class="swatch" style="border-radius:12px"></div><div class="lbl">--r-md</div><div class="val">12px</div></div>
  <div class="item"><div class="swatch" style="border-radius:16px"></div><div class="lbl">--r-lg</div><div class="val">16px</div></div>
  <div class="item"><div class="swatch" style="border-radius:20px"></div><div class="lbl">--r-xl</div><div class="val">20px</div></div>
  <div class="item"><div class="swatch" style="border-radius:28px"></div><div class="lbl">--r-2xl</div><div class="val">28px</div></div>
  <div class="item"><div class="swatch" style="border-radius:999px"></div><div class="lbl">--r-pill</div><div class="val">∞</div></div>
</div>
</body></html>
