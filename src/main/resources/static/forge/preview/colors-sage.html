<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-canvas);}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .sw{aspect-ratio:1.1;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:var(--fg-on-dark);font-family:var(--font-mono);font-size:11px;}
  .sw.lt{color:var(--fg-1);}
  .sw .name{font-weight:600;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;}
  .sw .hex{opacity:.85;}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#0E1A11"><div class="name">sage 950</div><div class="hex">#0E1A11</div></div>
  <div class="sw" style="background:#18271B"><div class="name">sage 900</div><div class="hex">#18271B</div></div>
  <div class="sw" style="background:#1A2E1A"><div class="name">sage 800 ●</div><div class="hex">#1A2E1A</div></div>
  <div class="sw" style="background:#2E5535"><div class="name">sage 700</div><div class="hex">#2E5535</div></div>
  <div class="sw" style="background:#4A7A4F"><div class="name">sage 600</div><div class="hex">#4A7A4F</div></div>
  <div class="sw" style="background:#6A9466"><div class="name">sage 500 ●</div><div class="hex">#6A9466</div></div>
  <div class="sw lt" style="background:#8FB286"><div class="name">sage 400</div><div class="hex">#8FB286</div></div>
  <div class="sw lt" style="background:#B5CCAC"><div class="name">sage 300</div><div class="hex">#B5CCAC</div></div>
  <div class="sw lt" style="background:#D2E0CB"><div class="name">sage 200</div><div class="hex">#D2E0CB</div></div>
  <div class="sw lt" style="background:#E8EFE5"><div class="name">sage 100</div><div class="hex">#E8EFE5</div></div>
  <div class="sw lt" style="background:#F2F6EF"><div class="name">sage 50</div><div class="hex">#F2F6EF</div></div>
  <div class="sw lt" style="background:#FAFAFA;border:1px solid #D6D6D2"><div class="name">bone 50 ●</div><div class="hex">#FAFAFA</div></div>
</div>
</body></html>
