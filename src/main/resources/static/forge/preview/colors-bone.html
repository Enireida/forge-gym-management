<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Bone / Beige</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#FFFFFF;}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .sw{aspect-ratio:1.1;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-family:var(--font-mono);font-size:11px;}
  .sw.dark{color:var(--fg-on-dark);}
  .sw .name{font-weight:600;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;}
  .sw .hex{opacity:.85;}
</style></head>
<body>
<div class="row">
  <div class="sw dark" style="background:#0E0E0C"><div class="name">bone 950 ●</div><div class="hex">#0E0E0C</div></div>
  <div class="sw dark" style="background:#1A1A18"><div class="name">bone 900</div><div class="hex">#1A1A18</div></div>
  <div class="sw dark" style="background:#2E2E2A"><div class="name">bone 800</div><div class="hex">#2E2E2A</div></div>
  <div class="sw dark" style="background:#4A4A45"><div class="name">bone 700 ●</div><div class="hex">#4A4A45</div></div>
  <div class="sw dark" style="background:#6A6A65"><div class="name">bone 600</div><div class="hex">#6A6A65</div></div>
  <div class="sw dark" style="background:#8A8A85"><div class="name">bone 500</div><div class="hex">#8A8A85</div></div>
  <div class="sw" style="background:#A8A8A2"><div class="name">bone 400</div><div class="hex">#A8A8A2</div></div>
  <div class="sw" style="background:#C2C2BC"><div class="name">bone 300</div><div class="hex">#C2C2BC</div></div>
  <div class="sw" style="background:#D6D6D2"><div class="name">bone 200</div><div class="hex">#D6D6D2</div></div>
  <div class="sw" style="background:#EEEEEA"><div class="name">bone 100</div><div class="hex">#EEEEEA</div></div>
  <div class="sw" style="background:#FAFAFA;border:1px solid #D6D6D2"><div class="name">bone 50 ●</div><div class="hex">#FAFAFA</div></div>
  <div class="sw" style="background:#F5F5F3;border:1px solid #D6D6D2"><div class="name">cream 25</div><div class="hex">#F5F5F3</div></div>
</div>
</body></html>
