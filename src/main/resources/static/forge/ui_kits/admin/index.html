<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forge — Admin</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  body { margin:0; font-family: var(--font-sans); }
  .app { display:flex; height:100vh; background: var(--bg-canvas); }
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .content { flex:1; overflow-y:auto; padding: 28px 32px 64px; }
  .grid-3 { display:grid; grid-template-columns: repeat(3,1fr); gap:16px; margin-bottom:24px; }
  .grid-32 { display:grid; grid-template-columns: 2fr 1fr; gap:16px; margin-bottom:24px; }
  .grid-22 { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:24px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<script type="text/babel" src="AdminParts.jsx"></script>
<script type="text/babel" src="AdminScreensB.jsx"></script>
<script type="text/babel" src="AdminScreensC.jsx"></script>

<script type="text/babel">
function HomeScreen() {
  return (
    <div className="content">
      <div className="grid-3">
        <KPI label="Active members" val="247" delta="+12" deltaLabel="this month" good ico="users" />
        <KPI label="Check-ins today" val="184" delta="+8.4%" deltaLabel="vs last Sun" good ico="door-open" />
        <KPI label="Revenue · this month" val="€20,640" delta="+7.3%" deltaLabel="vs Apr" good ico="banknote" />
      </div>
      <div className="grid-32">
        <RevenueChart />
        <ChurnCard />
      </div>
      <div className="grid-22">
        <AttendanceCard />
        <ActivityFeed />
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = React.useState('home');
  React.useEffect(() => { setTimeout(() => window.lucide && window.lucide.createIcons(), 80); }, [screen]);

  const titles = {
    home: { t:'Good morning, Arben.', b:'Dashboard · Sunday, May 11' },
    members: { t:'Members', b:'247 active · 18 expiring · 14 expired' },
    payments: { t:'Payments & invoices', b:'May 2026' },
    plans: { t:'Membership plans', b:'4 plans · 247 active subscriptions' },
    equipment: { t:'Equipment & maintenance', b:'38 units · 1 out of service' },
    staff: { t:'Staff & trainers', b:'6 active · 3 trainers · 1 owner' },
    announcements: { t:'Announcements', b:'4 published · last 30 days' },
    reports: { t:'Reports & analytics', b:'Year to date · 2026' },
    trainers: { t:'Trainers', b:'3 active trainers' },
    attendance: { t:'Attendance log', b:'Live · 47 inside' },
    pt: { t:'Personal training packages', b:'42 active subscriptions' },
  };
  const t = titles[screen] || titles.home;

  let body;
  if (screen === 'home') body = <HomeScreen/>;
  else if (screen === 'members') body = <MembersScreen/>;
  else if (screen === 'payments') body = <PaymentsScreen/>;
  else if (screen === 'plans') body = <PlansScreen/>;
  else if (screen === 'equipment') body = <EquipmentScreen/>;
  else if (screen === 'staff' || screen === 'trainers') body = <StaffScreen/>;
  else if (screen === 'announcements') body = <AnnouncementsScreen/>;
  else if (screen === 'reports') body = <ReportsScreen/>;
  else body = <div className="content" style={{padding:'80px 32px', textAlign:'center', color:'#8FB286', fontFamily:'Instrument Serif, serif', fontStyle:'italic', fontSize:24}}>This screen is in the roadmap.</div>;

  return (
    <div className="app" data-screen-label={`Admin · ${screen}`}>
      <AdminSidebar active={screen} onSelect={setScreen} />
      <div className="main">
        <AdminTopbar title={t.t} breadcrumbs={t.b} />
        {body}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
