<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forge — Mobile App</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bone-100); font-family: var(--font-sans); }
  .stage-header { padding: 40px 48px 24px; max-width: 1480px; margin: 0 auto; }
  .stage-header .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--bone-700); margin-bottom: 8px; }
  .stage-header h1 { font-family: var(--font-display); font-weight: 400; font-size: 56px; line-height: 1; letter-spacing: -0.02em; margin: 0 0 12px; color: var(--fg-1); }
  .stage-header h1 em { font-style: italic; color: var(--sage-700); }
  .stage-header p { color: var(--fg-2); font-size: 16px; line-height: 1.55; max-width: 640px; margin: 0; }
  .frames-row { display: flex; gap: 32px; padding: 32px 48px 64px; overflow-x: auto; scroll-padding: 48px; }
  .frame-cell { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .frame-cell-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.10em; color: var(--bone-700); text-transform: uppercase; }
  .frame-cell-title { font-family: var(--font-display); font-style: italic; font-size: 22px; color: var(--fg-1); }
</style>
</head>
<body>

<header class="stage-header" data-screen-label="Mobile App Header">
  <div class="eyebrow">Forge · Mobile</div>
  <h1>Member app, <em>iOS</em>.</h1>
  <p>Six core screens — login, home, progress, check-in, AI coach, food tracker. Scroll horizontally to view all frames.</p>
</header>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<script type="text/babel" src="../../assets/ios-frame.jsx"></script>
<script type="text/babel" src="MobileScreensA.jsx"></script>
<script type="text/babel" src="MobileScreensB.jsx"></script>

<script type="text/babel">
function Cell({ label, title, children, withTabs, activeTab }) {
  return (
    <div className="frame-cell">
      <div style={{display:'flex', flexDirection:'column', alignItems:'center', gap:4}}>
        <span className="frame-cell-label">{label}</span>
        <span className="frame-cell-title">{title}</span>
      </div>
      <IOSFrame variant="14pro" theme="light" hideStatus={false}>
        <div style={{position:'relative', height:'100%'}}>
          {children}
          {withTabs && <TabBar active={activeTab} />}
        </div>
      </IOSFrame>
    </div>
  );
}

function App() {
  React.useEffect(() => {
    const t = setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 80);
    return () => clearTimeout(t);
  }, []);
  return (
    <div className="frames-row" data-screen-label="Mobile Screens Row">
      <Cell label="01 · Auth" title="Sign in"><MobileLogin /></Cell>
      <Cell label="02 · Today" title="Home" withTabs activeTab="home"><MobileHome /></Cell>
      <Cell label="03 · Progress" title="Body & weight" withTabs activeTab="progress"><MobileProgress /></Cell>
      <Cell label="04 · Door" title="Check-in"><MobileCheckin /></Cell>
      <Cell label="05 · Coach" title="AI chat" withTabs activeTab="ai"><MobileAIChat /></Cell>
      <Cell label="06 · Nutrition" title="Food tracker" withTabs activeTab="food"><MobileFood /></Cell>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
