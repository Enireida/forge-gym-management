# ============================================================
# Forge - Application Configuration
# CS 305 Advanced Java - UNYT Spring 2026
# ============================================================

# Application
spring.application.name=Forge
server.port=8080

# Multipart file upload (for CSV workout import)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# H2 Embedded Database (file-based, persisted outside OneDrive to avoid lock-file conflicts)
# The database lives in ~/.forge/data/ which is NOT synced by OneDrive.
# AUTO_SERVER=TRUE allows DevTools hot-reload without "Database already in use" errors.

spring.datasource.url=jdbc:h2:file:${user.home}/.forge/data/gymdb;AUTO_SERVER=TRUE;MODE=LEGACY
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (visit http://localhost:8080/h2-console — JDBC URL: jdbc:h2:file:~/.forge/data/gymdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate — 'update' preserves data between restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL initialization — always run, data.sql uses MERGE so it is idempotent
spring.sql.init.mode=always

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.unyt.gym=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG
logging.file.name=${user.home}/.forge/forge.log

# Custom application properties
gym.app.name=Forge
gym.app.version=1.0.0
gym.executor.pool-size=4

# ============================================================
# Spring Mail — Gmail SMTP
# Credentials come from environment variables — NEVER hardcode
# passwords in this file (it gets committed to Git).
#
# Before running: set these in your OS or a local .env file
#   FORGE_MAIL_USERNAME=recienireida@gmail.com
#   FORGE_MAIL_PASSWORD=your_16char_app_password
#   FORGE_MAIL_DEV_MODE=false   (only when sending real email)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${FORGE_MAIL_USERNAME:}
# SECURITY: Set FORGE_MAIL_PASSWORD as an environment variable — never commit real credentials
spring.mail.password=${FORGE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# Timeouts so a slow/blocked SMTP connection fails fast instead of hanging the request
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
spring.mail.default-encoding=UTF-8
forge.mail.dev-mode=false
forge.mail.from=${FORGE_MAIL_FROM:}
forge.mail.admin-email=${FORGE_MAIL_ADMIN:}

# ============================================================
# Strava OAuth2 Integration
# ============================================================
strava.client-id=${STRAVA_CLIENT_ID:}
strava.client-secret=${STRAVA_CLIENT_SECRET:}
strava.redirect-uri=http://localhost:8080/client/strava/callback

# ============================================================
# Google Fit OAuth2 Integration
# Credentials from Google Cloud Console > APIs & Services > Credentials
# Make sure to enable the "Fitness API" in API Library
# ============================================================
googlefit.client-id=${GOOGLEFIT_CLIENT_ID:}
googlefit.client-secret=${GOOGLEFIT_CLIENT_SECRET:}
googlefit.redirect-uri=http://localhost:8080/client/googlefit/callback

# ============================================================
# Fitbit OAuth2 Integration
# Register your app at https://dev.fitbit.com/apps/new
#   - OAuth 2.0 Application Type: Server
#   - Callback URL: http://localhost:8080/client/fitbit/callback
# ============================================================
fitbit.client-id=${FITBIT_CLIENT_ID:YOUR_FITBIT_CLIENT_ID}
fitbit.client-secret=${FITBIT_CLIENT_SECRET:YOUR_FITBIT_CLIENT_SECRET}
fitbit.redirect-uri=http://localhost:8080/client/fitbit/callback

# ============================================================
# Apple Watch / HealthKit API
# ============================================================
forge.watch.api-key=forge-watch-dev-key-2026

# ============================================================
# Local credentials override — loads application-local.properties if it exists
# That file contains real passwords and is gitignored — never commit it
# ============================================================
spring.config.import=optional:classpath:application-local.properties
