<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" spellcheck="false">
<head>
    <meta charset="UTF-8">
    <title>AI Coach, Forge</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        /* ── Layout ─────────────────────────────────── */
        .ai-wrap {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 24px;
            height: calc(100vh - var(--topbar-h, 64px) - 48px);
            max-height: 820px;
        }
        @media (max-width: 900px) { .ai-wrap { grid-template-columns: 1fr; max-height: none; } }

        /* ── Sidebar panel ───────────────────────────── */
        .ai-panel {
            background: var(--ink);
            border-radius: var(--r-xl);
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .ai-panel::before {
            content: '';
            position: absolute;
            top: -80px; right: -80px;
            width: 260px; height: 260px;
            background: radial-gradient(circle, rgba(184,149,106,0.20), transparent 65%);
            pointer-events: none;
        }
        .ai-badge {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--font-mono);
            font-size: 10px; font-weight: 600;
            letter-spacing: .18em; text-transform: uppercase;
            color: var(--accent);
            padding: 6px 12px;
            background: rgba(184,149,106,.12);
            border: 1px solid rgba(184,149,106,.25);
            border-radius: var(--r-pill);
            width: fit-content;
        }
        .ai-badge::before {
            content: '';
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: .6; transform: scale(.8); }
        }
        .ai-panel-title {
            font-family: var(--font-display);
            font-size: 26px; font-weight: 400;
            line-height: 1.1; letter-spacing: -.01em;
            color: #fff;
        }
        .ai-panel-title em { font-style: italic; color: var(--accent); }
        .ai-panel-sub {
            font-size: 13px; color: rgba(255,255,255,.55);
            line-height: 1.5;
        }

        /* Suggested prompts */
        .ai-prompts { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
        .ai-prompt-label {
            font-family: var(--font-mono);
            font-size: 10px; font-weight: 600;
            letter-spacing: .14em; text-transform: uppercase;
            color: rgba(255,255,255,.35);
            margin-bottom: 2px;
        }
        .ai-prompt {
            display: block;
            padding: 10px 14px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.10);
            border-radius: var(--r-md);
            font-size: 13px; color: rgba(255,255,255,.80);
            cursor: pointer;
            text-align: left;
            transition: background .15s, border-color .15s;
            line-height: 1.4;
        }
        .ai-prompt:hover {
            background: rgba(184,149,106,.15);
            border-color: rgba(184,149,106,.30);
            color: #fff;
        }

        /* Member context pill */
        .ai-context {
            margin-top: auto;
            padding: 12px 14px;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: var(--r-md);
            font-size: 12px; color: rgba(255,255,255,.45);
        }
        .ai-context strong { color: rgba(255,255,255,.75); }

        /* ── Chat area ───────────────────────────────── */
        .ai-chat {
            background: var(--bg-surface);
            border: 1px solid var(--line-1);
            border-radius: var(--r-xl);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--line-1);
            display: flex; align-items: center; gap: 12px;
        }
        .chat-header-icon {
            width: 36px; height: 36px;
            background: var(--accent-soft);
            border-radius: var(--r-md);
            display: grid; place-items: center;
            color: var(--accent-deep);
        }
        .chat-header-title {
            font-family: var(--font-display);
            font-size: 18px; font-weight: 400;
            letter-spacing: -.01em;
        }
        .chat-header-title em { font-style: italic; color: var(--accent-deep); }
        .chat-header-sub {
            font-family: var(--font-mono);
            font-size: 11px; color: var(--stone-400);
            letter-spacing: .08em;
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex; flex-direction: column; gap: 18px;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--stone-200); border-radius: 999px; }

        /* Message bubbles */
        .msg { display: flex; gap: 10px; max-width: 85%; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.bot  { align-self: flex-start; }

        .msg-avatar {
            width: 32px; height: 32px; flex-shrink: 0;
            border-radius: var(--r-sm);
            display: grid; place-items: center;
            font-size: 12px; font-weight: 600;
        }
        .msg.bot  .msg-avatar { background: var(--accent-soft); color: var(--accent-deep); }
        .msg.user .msg-avatar { background: var(--ink); color: #fff; }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
        }
        .msg.bot  .msg-bubble {
            background: var(--bg-sunken);
            border-bottom-left-radius: 4px;
            color: var(--fg-1);
        }
        .msg.user .msg-bubble {
            background: var(--ink);
            border-bottom-right-radius: 4px;
            color: #fff;
        }
        .msg-bubble strong { font-weight: 700; }
        .msg-bubble p { margin: 0 0 8px; }
        .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-bubble ul { margin: 6px 0 6px 16px; padding: 0; }
        .msg-bubble li { margin-bottom: 4px; }

        /* Typing indicator */
        .typing { display: flex; align-items: center; gap: 5px; padding: 14px 16px; }
        .typing span {
            width: 7px; height: 7px;
            background: var(--stone-300);
            border-radius: 50%;
            animation: bounce 1.2s ease-in-out infinite;
        }
        .typing span:nth-child(2) { animation-delay: .2s; }
        .typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes bounce { 0%,80%,100% { transform: scale(0.7); opacity:.5 } 40% { transform: scale(1); opacity:1 } }

        /* Input */
        .chat-input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--line-1);
            display: flex; gap: 12px; align-items: flex-end;
        }
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-sunken);
            border: 1px solid var(--line-1);
            border-radius: var(--r-xl);
            font-size: 14px;
            font-family: var(--font-sans);
            color: var(--fg-1);
            resize: none;
            line-height: 1.5;
            min-height: 46px; max-height: 120px;
            outline: none;
            transition: border-color .15s;
        }
        .chat-input:focus { border-color: var(--accent); }
        .chat-input::placeholder { color: var(--stone-400); }
        .chat-send {
            width: 46px; height: 46px; flex-shrink: 0;
            background: var(--ink);
            color: #fff;
            border: none; border-radius: var(--r-xl);
            cursor: pointer;
            display: grid; place-items: center;
            transition: background .15s, transform .1s;
        }
        .chat-send:hover  { background: var(--ink-soft); }
        .chat-send:active { transform: scale(.95); }
        .chat-send svg    { width: 18px; height: 18px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div th:replace="~{fragments/layout :: clientSidebar('ai')}"></div>
    <div th:replace="~{fragments/layout :: topbar('AI Coach')}"></div>

    <main class="main">
        <div class="ai-wrap">

            <!-- Left panel -->
            <div class="ai-panel">
                <div class="ai-badge">AI Fitness Coach</div>

                <div>
                    <div class="ai-panel-title">Your personal<br><em>Forge coach.</em></div>
                    <div class="ai-panel-sub" style="margin-top:10px">
                        Powered by your real training data, measurements, workouts, attendance, and PT history.
                    </div>
                </div>

                <div class="ai-prompts">
                    <div class="ai-prompt-label">Try asking</div>
                    <button class="ai-prompt" onclick="sendPrompt(this)">What's my BMI and what should I focus on?</button>
                    <button class="ai-prompt" onclick="sendPrompt(this)">Give me a workout recommendation for today</button>
                    <button class="ai-prompt" onclick="sendPrompt(this)">How many calories should I eat?</button>
                    <button class="ai-prompt" onclick="sendPrompt(this)">Show me my progress summary</button>
                    <button class="ai-prompt" onclick="sendPrompt(this)">I need some motivation</button>
                    <button class="ai-prompt" onclick="sendPrompt(this)">What protein intake do I need?</button>
                </div>

                <div class="ai-context">
                    <strong th:text="${me != null ? me.name : 'Member'}">Member</strong> ·
                    <span th:text="${me != null and me.plan != null ? me.plan.name : 'Standard'}">Standard</span> ·
                    <span th:text="${me != null ? me.status : 'ACTIVE'}">ACTIVE</span>
                </div>
            </div>

            <!-- Chat area -->
            <div class="ai-chat">
                <div class="chat-header">
                    <div class="chat-header-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/>
                        </svg>
                    </div>
                    <div>
                        <div class="chat-header-title">Forge <em>AI Coach</em></div>
                        <div class="chat-header-sub">ALWAYS AVAILABLE · POWERED BY YOUR DATA</div>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <!-- Welcome message injected by JS -->
                </div>

                <div class="chat-input-area">
                    <textarea class="chat-input" id="chatInput"
                              placeholder="Ask me anything about fitness, nutrition, or your progress..."
                              rows="1"></textarea>
                    <button class="chat-send" id="sendBtn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </div>

        </div>
    </main>
</div>

<script>
    const messagesEl = document.getElementById('chatMessages');
    const inputEl    = document.getElementById('chatInput');
    const sendBtn    = document.getElementById('sendBtn');

    // ── Auto-resize textarea ─────────────────────────────
    inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    // ── Send on Enter (Shift+Enter for newline) ──────────
    inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // ── Render helpers ───────────────────────────────────
    function appendMessage(role, text) {
        const isUser = role === 'user';
        const initial = isUser ? (/*[[${me != null ? #strings.substring(me.name,0,1) : 'M'}]]*/ 'M') : '✦';
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.innerHTML = `
            <div class="msg-avatar">${initial}</div>
            <div class="msg-bubble">${formatText(text)}</div>`;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'msg bot';
        div.id = 'typingIndicator';
        div.innerHTML = `
            <div class="msg-avatar">✦</div>
            <div class="msg-bubble typing"><span></span><span></span><span></span></div>`;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    /** Convert **bold**, newlines, bullet lists to HTML. */
    function formatText(text) {
        let html = text
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n/g, '<br>');
        // wrap in paragraphs
        html = '<p>' + html + '</p>';
        return html;
    }

    // ── Send message ─────────────────────────────────────
    async function sendMessage() {
        const msg = inputEl.value.trim();
        if (!msg) return;

        inputEl.value = '';
        inputEl.style.height = 'auto';
        sendBtn.disabled = true;

        appendMessage('user', msg);
        showTyping();

        try {
            const res = await fetch('/api/ai/coach', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            hideTyping();
            if (data.reply) {
                appendMessage('bot', data.reply);
            } else {
                appendMessage('bot', 'Sorry, I had trouble answering that. Please try again.');
            }
        } catch (err) {
            hideTyping();
            appendMessage('bot', 'Network error, please check your connection and try again.');
        } finally {
            sendBtn.disabled = false;
            inputEl.focus();
        }
    }

    // ── Suggested prompt click ───────────────────────────
    function sendPrompt(btn) {
        inputEl.value = btn.textContent.trim();
        sendMessage();
    }

    // ── Welcome message on load ──────────────────────────
    window.addEventListener('load', () => {
        const name = /*[[${me != null ? me.name.split(' ')[0] : 'there'}]]*/ 'there';
        appendMessage('bot',
            `Hey **${name}**!  I'm your **Forge AI Coach**.\n\n` +
            `I have access to your training data and I'm ready to help , ask me about your **progress**, ` +
            `**workout** plan, **nutrition**, or anything fitness-related.\n\n` +
            `Try one of the suggested questions on the left, or just type below!`
        );

        // If redirected from the home widget with ?q=..., auto-send that question
        const params = new URLSearchParams(window.location.search);
        const q = params.get('q');
        if (q) {
            inputEl.value = q;
            setTimeout(sendMessage, 400);
        }
    });
</script>

</body>
</html>
