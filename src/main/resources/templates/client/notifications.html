<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" spellcheck="false">
<head>
    <meta charset="UTF-8">
    <title>Notifications - Forge</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .notif-item{display:flex;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line-1);transition:background .15s}
        .notif-item:last-child{border-bottom:none}
        .notif-item.unread{background:var(--accent-pale);border-left:3px solid var(--accent)}
        .notif-icon{width:36px;height:36px;border-radius:var(--r-md);background:var(--bg-sunken);color:var(--accent-deep);display:grid;place-items:center;flex-shrink:0}
        .notif-icon svg{width:18px;height:18px}
        .notif-body{flex:1}
        .notif-title{font-weight:600;font-size:14px;color:var(--fg-1)}
        .notif-msg{font-size:13px;color:var(--fg-2);margin-top:2px;line-height:1.4}
        .notif-time{font-size:11px;color:var(--stone-400);margin-top:4px}
    </style>
</head>
<body>
<div class="dashboard">
    <div th:replace="~{fragments/layout :: clientSidebar('notifications')}"></div>
    <div th:replace="~{fragments/layout :: topbar('Notifications')}"></div>
    <main class="main">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
            <div>
                <span style="font-family:var(--font-display);font-size:14px;color:var(--stone-400)"
                      th:text="${unreadCount} + ' unread'"></span>
            </div>
            <div style="display:flex;gap:8px">
                <form autocomplete="off" th:if="${unreadCount > 0}" method="post" action="/client/notifications/read-all" style="margin:0">
                    <input type="hidden" name="_csrf" th:value="${csrfToken}" autocomplete="nope">
                    <button class="btn btn-outline" type="submit" style="font-size:12px;padding:6px 14px">Mark all read</button>
                </form>
                <form autocomplete="off" th:unless="${#lists.isEmpty(notifications)}" method="post" action="/client/notifications/clear-all" style="margin:0"
                      onsubmit="return confirm('Delete all notifications?')">
                    <input type="hidden" name="_csrf" th:value="${csrfToken}" autocomplete="nope">
                    <button class="btn btn-outline" type="submit"
                            style="font-size:12px;padding:6px 14px;color:var(--signal-danger);border-color:var(--signal-danger)">Clear all</button>
                </form>
            </div>
        </div>

        <div class="card" style="padding:0;overflow:hidden">
            <div th:if="${#lists.isEmpty(notifications)}"
                 style="text-align:center;padding:48px;color:var(--stone-400);font-style:italic">
                No notifications yet. You're all caught up!
            </div>

            <div th:each="n : ${notifications}" class="notif-item" th:classappend="${!n.read ? 'unread' : ''}">
                <div class="notif-icon" th:switch="${n.type.name()}">
                    <svg th:case="'MEMBERSHIP_EXPIRY'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <svg th:case="'CLASS_REMINDER'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <svg th:case="'GOAL_ACHIEVED'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="6"/><polyline points="12 12 16 14"/></svg>
                    <svg th:case="'NEW_CLASS'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v6M2 12h6M16 12h6M12 16v6"/></svg>
                    <svg th:case="'TRAINER_SESSION'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <svg th:case="'WAITLIST_AVAILABLE'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                    <svg th:case="'ANNOUNCEMENT'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 21 4 18 21 12 14 3 11"/></svg>
                    <svg th:case="*" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                </div>
                <div class="notif-body">
                    <div class="notif-title" th:text="${n.title}">Title</div>
                    <div class="notif-msg" th:text="${n.message}">Message</div>
                    <div class="notif-time" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, HH:mm')}">Time</div>
                    <a th:if="${n.linkUrl}" th:href="${n.linkUrl}" style="font-size:12px;color:var(--accent-deep);margin-top:4px;display:inline-block">View details &#8594;</a>
                </div>
                <div style="display:flex;gap:6px;flex-shrink:0;align-items:flex-start">
                    <form autocomplete="off" th:if="${!n.read}" method="post" th:action="@{'/client/notifications/' + ${n.id} + '/read'}" style="margin:0">
                        <input type="hidden" name="_csrf" th:value="${csrfToken}" autocomplete="nope">
                        <button type="submit" style="background:none;cursor:pointer;font-size:10px;color:var(--stone-400);padding:4px 8px;border-radius:var(--r-md);border:1px solid var(--line-1)" title="Mark read">&#x2713;</button>
                    </form>
                    <form autocomplete="off" method="post" th:action="@{'/client/notifications/' + ${n.id} + '/delete'}" style="margin:0">
                        <input type="hidden" name="_csrf" th:value="${csrfToken}" autocomplete="nope">
                        <button type="submit" style="background:none;cursor:pointer;font-size:12px;color:var(--stone-400);padding:4px 8px;border-radius:var(--r-md);border:1px solid var(--line-1)" title="Delete">&#x2715;</button>
                    </form>
                </div>
            </div>
        </div>

    </main>
</div>
</body>
</html>
