<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" spellcheck="false">
<head>
    <meta charset="UTF-8">
    <title>Trainer - Forge</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--stone-500);text-decoration:none;font-size:13px;margin-bottom:16px;transition:.15s}
        .back-link:hover{color:var(--accent-deep)}
        .hero{display:flex;gap:28px;align-items:flex-start;background:var(--bg-surface);border:1px solid var(--line-1);border-radius:var(--r-xl);padding:30px;margin-bottom:24px;flex-wrap:wrap}
        .hero-photo{width:140px;height:140px;border-radius:50%;background:var(--accent-pale);color:var(--accent-deep);display:grid;place-items:center;font-family:var(--font-display);font-size:54px;font-weight:400;overflow:hidden;flex-shrink:0;border:4px solid var(--accent-pale)}
        .hero-photo img{width:100%;height:100%;object-fit:cover}
        .hero-info{flex:1;min-width:240px}
        .hero-name{font-family:var(--font-display);font-size:36px;font-weight:400;letter-spacing:-.01em;color:var(--fg-1);line-height:1.1;margin-bottom:6px}
        .hero-name em{font-style:italic;color:var(--accent-deep)}
        .hero-role{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:8px}
        .hero-specialty{font-size:14px;color:var(--fg-2);margin-bottom:14px}
        .hero-rating{display:flex;align-items:center;gap:8px;margin-bottom:14px}
        .hero-rating .stars{display:inline-flex;gap:2px}
        .hero-rating .star{color:var(--line-2);font-size:18px}
        .hero-rating .star.filled{color:#f59e0b}
        .hero-rating .num{font-size:13px;color:var(--stone-500)}
        .contact-row{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--stone-500);margin-top:6px}
        .contact-row .item{display:flex;align-items:center;gap:6px}
        .bio{font-size:14px;color:var(--fg-2);line-height:1.65;margin-top:8px}
        .certs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
        .cert{padding:4px 12px;background:var(--bg-sunken);border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--stone-600)}
        .section-title{font-family:var(--font-display);font-size:22px;font-weight:400;color:var(--fg-1);margin:0 0 16px}
        .section-title em{font-style:italic;color:var(--accent-deep)}
        .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
        .slot{background:var(--bg-surface);border:1px solid var(--line-1);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
        .slot:hover{box-shadow:var(--shadow-2)}
        .slot-date{font-family:var(--font-display);font-size:15px;color:var(--fg-1)}
        .slot-time{font-family:var(--font-mono);font-size:18px;font-weight:600;color:var(--accent-deep);letter-spacing:.04em}
        .slot-notes{font-size:12px;color:var(--stone-400);font-style:italic}
        .book-btn{padding:8px 18px;border-radius:var(--r-pill);font-size:13px;font-weight:600;border:none;cursor:pointer;background:var(--accent);color:#fff;align-self:flex-start;transition:.15s}
        .book-btn:hover{background:var(--accent-deep)}
        .class-card{background:var(--bg-surface);border:1px solid var(--line-1);border-radius:var(--r-lg);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
        .class-card .left{display:flex;flex-direction:column;gap:2px}
        .class-card .name{font-weight:600;color:var(--fg-1);font-size:14px}
        .class-card .meta{font-size:12px;color:var(--stone-500)}
        .empty{text-align:center;padding:28px;color:var(--stone-400);font-style:italic;font-size:13px}
    </style>
</head>
<body>
<div class="dashboard">
    <div th:replace="~{fragments/layout :: clientSidebar('book-trainer')}"></div>
    <div th:replace="~{fragments/layout :: topbar('Trainer Profile')}"></div>
    <main class="main">

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

        <a href="/client/book-trainer" class="back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            All trainers
        </a>

        <!-- HERO -->
        <div class="hero">
            <div class="hero-photo">
                <img th:if="${trainer.photoData != null and !trainer.photoData.isEmpty()}"
                     th:src="${trainer.photoData}" alt="Photo">
                <span th:if="${trainer.photoData == null or trainer.photoData.isEmpty()}"
                      th:text="${#strings.substring(trainer.name,0,1).toUpperCase()}">T</span>
            </div>
            <div class="hero-info">
                <div class="hero-name"><em th:text="${trainer.name}">Trainer Name</em></div>
                <div class="hero-role" th:text="${trainer.role != null ? trainer.role : 'Trainer'}">Trainer</div>
                <div class="hero-specialty" th:if="${trainer.specialty != null and !trainer.specialty.isEmpty()}"
                     th:text="${'Specialty · ' + trainer.specialty}">Specialty</div>

                <div class="hero-rating" th:if="${ratingCount > 0}">
                    <div class="stars">
                        <span th:each="i : ${#numbers.sequence(1,5)}" class="star"
                              th:classappend="${avgRating >= i ? 'filled' : ''}">&#9733;</span>
                    </div>
                    <span class="num"
                          th:text="${#numbers.formatDecimal(avgRating,1,1)} + ' (' + ${ratingCount} + ' ratings)'">4.5 (12)</span>
                </div>

                <div class="contact-row">
                    <div class="item" th:if="${trainer.email != null}">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <span th:text="${trainer.email}">email</span>
                    </div>
                    <div class="item" th:if="${trainer.phone != null and !trainer.phone.isEmpty()}">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        <span th:text="${trainer.phone}">phone</span>
                    </div>
                </div>

                <div class="bio" th:if="${trainer.bio != null and !trainer.bio.isEmpty()}"
                     th:text="${trainer.bio}">Trainer bio paragraph.</div>

                <div class="certs" th:if="${trainer.certifications != null and !trainer.certifications.isEmpty()}">
                    <span class="cert" th:each="c : ${#strings.arraySplit(trainer.certifications, ',')}"
                          th:text="${#strings.trim(c)}">Cert</span>
                </div>
            </div>
        </div>

        <!-- INLINE PT SLOT BOOKING -->
        <div style="margin-bottom:28px">
            <div class="section-title">Book a 1-on-1 <em>session</em></div>

            <div th:if="${#lists.isEmpty(availableSlots)}" class="empty">
                No open PT slots right now from this trainer. Check back soon.
            </div>

            <div class="slot-grid" th:unless="${#lists.isEmpty(availableSlots)}">
                <div class="slot" th:each="s : ${availableSlots}">
                    <div>
                        <div class="slot-date" th:text="${#temporals.format(s.slotDate,'EEE, d MMMM yyyy')}">Mon, 1 Jun</div>
                        <div class="slot-time"
                             th:text="${#temporals.format(s.startTime,'HH:mm') + ' – ' + #temporals.format(s.endTime,'HH:mm')}">09:00 – 10:00</div>
                    </div>
                    <div class="slot-notes" th:if="${s.notes != null and !s.notes.isEmpty()}"
                         th:text="${s.notes}">notes</div>
                    <form autocomplete="off" method="post" th:action="@{'/client/book-trainer/' + ${s.id} + '/book'}" style="margin:0">
                        <input type="hidden" name="_csrf" th:value="${csrfToken}" autocomplete="nope">
                        <button class="book-btn" type="submit">Book this slot</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- UPCOMING CLASSES BY THIS TRAINER -->
        <div th:unless="${#lists.isEmpty(upcomingClasses)}">
            <div class="section-title">Upcoming <em>classes</em></div>
            <div class="class-card" th:each="c : ${upcomingClasses}">
                <div class="left">
                    <div class="name" th:text="${c.name}">Class</div>
                    <div class="meta"
                         th:text="${#temporals.format(c.dateTime,'EEE, d MMM · HH:mm')} + ' · ' + ${c.durationMinutes} + ' min'">Date</div>
                </div>
                <a href="/client/classes" class="book-btn"
                   style="background:none;color:var(--accent-deep);border:1px solid var(--accent);text-decoration:none">Open in classes →</a>
            </div>
        </div>

    </main>
</div>
</body>
</html>
