<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" spellcheck="false">
<head><meta charset="UTF-8"><title>Payments, Forge</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
<style>
    .badge-refunded{background:#fff3e0;color:#b45309}
    .badge-pending{background:var(--signal-warning-bg);color:var(--signal-warning)}
    .badge-cancelled{background:var(--stone-100);color:var(--stone-500)}

    /* ── 3-dot menu ── */
    .dot-wrap{position:relative;display:inline-block}
    .dot-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:none;border:1px solid var(--line-1);border-radius:var(--r-sm);cursor:pointer;color:var(--stone-400);transition:all var(--dur-fast) var(--ease-out)}
    .dot-btn:hover{background:var(--bg-sunken);border-color:var(--stone-200);color:var(--fg-1)}
    .dot-btn.active{background:var(--accent-pale);border-color:var(--accent);color:var(--accent-deep)}
    .dot-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--bg-surface);border:1px solid var(--line-1);border-radius:var(--r-lg);box-shadow:var(--shadow-3);min-width:176px;padding:5px;z-index:200;display:none;animation:dotIn .14s var(--ease-out)}
    .dot-menu.open{display:block}
    @keyframes dotIn{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    .dot-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--fg-2);cursor:pointer;width:100%;text-align:left;background:none;border:none;text-decoration:none;transition:background var(--dur-fast);font-family:var(--font-sans)}
    .dot-item:hover{background:var(--bg-sunken);color:var(--fg-1)}
    .dot-item svg{color:var(--stone-400);flex-shrink:0}
    .dot-item.active-item{color:var(--signal-success)}
    .dot-item.active-item svg{color:var(--signal-success)}
    .dot-item.active-item:hover{background:var(--signal-success-bg)}
    .dot-item.warn-item{color:var(--signal-warning)}
    .dot-item.warn-item svg{color:var(--signal-warning)}
    .dot-item.warn-item:hover{background:var(--signal-warning-bg)}
    .dot-sep{height:1px;background:var(--line-1);margin:4px 6px}
    .dot-section-label{padding:4px 10px 2px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--stone-400)}
</style>
</head>
<body>
<div class="dashboard">
    <div th:replace="~{fragments/layout :: adminSidebar('payments')}"></div>
    <div th:replace="~{fragments/layout :: topbar('Payments')}"></div>
    <main class="main">

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card success">
                <div class="stat-label">Revenue last 30 days</div>
                <div class="stat-value">$<span th:text="${revenue30}">0</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total payments</div>
                <div class="stat-value" th:text="${#lists.size(payments)}">0</div>
            </div>
        </div>

        <!-- RECORD MANUAL PAYMENT -->
        <div class="card">
            <div class="card-title">Record Manual Payment</div>
            <form autocomplete="off" method="post" action="/admin/payments/manual">
                <input type="hidden" name="_csrf" th:value="${csrfToken}" autocomplete="nope">
                <div class="form-row">
                    <div><label class="form-label">Member</label>
                        <select class="form-select" name="memberId" required>
                            <option value=""> select member </option>
                            <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name}">Member</option>
                        </select></div>
                    <div><label class="form-label">Amount ($)</label>
                        <input class="form-input" name="amount" type="number" step="0.01" min="0.01" required autocomplete="nope"></div>
                </div>
                <div class="form-row">
                    <div><label class="form-label">Method</label>
                        <select class="form-select" name="method">
                            <option>Cash</option><option>Card</option>
                            <option>Bank Transfer</option><option>Online</option>
                        </select></div>
                    <div><label class="form-label">Description</label>
                        <input class="form-input" name="description" placeholder="e.g. Monthly renewal, PT package…" autocomplete="nope"></div>
                </div>
                <button class="btn" type="submit">Record Payment</button>
            </form>
        </div>

        <!-- PAYMENT TABLE -->
        <div class="card">
            <div class="card-title">All Payments</div>
            <table>
                <thead><tr>
                    <th>Date</th><th>Member</th><th>Amount</th>
                    <th>Method</th><th>Status</th><th>Description</th>
                    <th style="width:48px;text-align:center"></th>
                </tr></thead>
                <tbody>
                <tr th:each="p : ${payments}">
                    <td style="font-family:var(--font-mono);font-size:12px;color:var(--stone-500)" th:text="${p.date}"></td>
                    <td style="font-weight:600" th:text="${p.member!=null ? p.member.name : ''}"></td>
                    <td><strong style="font-family:var(--font-mono)">$<span th:text="${p.amount}"></span></strong></td>
                    <td style="font-size:13px" th:text="${p.method}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${p.status=='Completed'}?'badge-success':(${p.status=='Refunded'}?'badge-refunded':(${p.status=='Cancelled'}?'badge-cancelled':'badge-pending'))"
                              th:text="${p.status}"></span>
                    </td>
                    <td style="font-size:13px;color:var(--stone-500)" th:text="${p.description}"></td>
                    <td style="text-align:center">
                        <div class="dot-wrap">
                            <button class="dot-btn" type="button" onclick="toggleDotMenu(this)">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
                                </svg>
                            </button>
                            <div class="dot-menu">
                                <div class="dot-section-label">Set Status</div>
                                <!-- Completed -->
                                <form autocomplete="off" method="post" th:action="@{'/admin/payments/'+${p.id}+'/status'}" style="margin:0">
                                    <input type="hidden" name="_csrf" th:value="${csrfToken}" autocomplete="nope">
                                    <input type="hidden" name="status" value="Completed" autocomplete="nope">
                                    <button class="dot-item active-item" type="submit">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                                        Completed
                                    </button>
                                </form>
                                <!-- Pending -->
                                <form autocomplete="off" method="post" th:action="@{'/admin/payments/'+${p.id}+'/status'}" style="margin:0">
                                    <input type="hidden" name="_csrf" th:value="${csrfToken}" autocomplete="nope">
                                    <input type="hidden" name="status" value="Pending" autocomplete="nope">
                                    <button class="dot-item warn-item" type="submit">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                        Pending
                                    </button>
                                </form>
                                <!-- Refunded -->
                                <form autocomplete="off" method="post" th:action="@{'/admin/payments/'+${p.id}+'/status'}" style="margin:0">
                                    <input type="hidden" name="_csrf" th:value="${csrfToken}" autocomplete="nope">
                                    <input type="hidden" name="status" value="Refunded" autocomplete="nope">
                                    <button class="dot-item" type="submit">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.6"/></svg>
                                        Refunded
                                    </button>
                                </form>
                                <!-- Cancelled -->
                                <form autocomplete="off" method="post" th:action="@{'/admin/payments/'+${p.id}+'/status'}" style="margin:0">
                                    <input type="hidden" name="_csrf" th:value="${csrfToken}" autocomplete="nope">
                                    <input type="hidden" name="status" value="Cancelled" autocomplete="nope">
                                    <button class="dot-item" type="submit">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                        Cancelled
                                    </button>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </main>
</div>

<script>
    function toggleDotMenu(btn) {
        const menu = btn.closest('.dot-wrap').querySelector('.dot-menu');
        const isOpen = menu.classList.contains('open');
        closeDotMenus();
        if (!isOpen) { menu.classList.add('open'); btn.classList.add('active'); }
    }
    function closeDotMenus() {
        document.querySelectorAll('.dot-menu.open').forEach(m => {
            m.classList.remove('open');
            const b = m.closest('.dot-wrap')?.querySelector('.dot-btn');
            if (b) b.classList.remove('active');
        });
    }
    document.addEventListener('click', e => { if (!e.target.closest('.dot-wrap')) closeDotMenus(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDotMenus(); });
</script>
</body>
</html>
