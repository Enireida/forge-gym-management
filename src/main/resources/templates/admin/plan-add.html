<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" spellcheck="false">
<head><meta charset="UTF-8"><title>New Plan — Forge</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="dashboard">
    <div th:replace="~{fragments/layout :: adminSidebar('plans')}"></div>
    <div th:replace="~{fragments/layout :: topbar('')}"></div>
    <main class="main">
        <div class="add-wrap">

            <div style="margin-bottom:28px">
                <div class="pg-breadcrumb">Plans / New plan</div>
                <h1 class="pg-heading" style="margin-bottom:0">New plan</h1>
            </div>

            <div th:if="${error}"
                 style="background:var(--signal-error-bg);border:1px solid var(--signal-error);
                        color:var(--signal-error);padding:10px 14px;border-radius:var(--r-md);
                        font-size:13px;margin-bottom:18px"
                 th:text="${error}"></div>

            <form autocomplete="off" method="post" action="/admin/plans">
                <input type="hidden" name="_csrf" th:value="${csrfToken}" autocomplete="nope">

                <div class="reg-section">
                    <div class="sec-header">
                        <div class="sec-num">01</div>
                        <div class="sec-header-text">
                            <h3>Plan details</h3>
                            <p>Pricing and duration shown to members at sign-up.</p>
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="field">
                            <label>Plan name <span class="req">*</span></label>
                            <input class="form-input" name="name" placeholder="e.g. Premium Monthly" required autocomplete="nope">
                        </div>
                        <div class="field">
                            <label>Price ($) <span class="req">*</span></label>
                            <input class="form-input" name="price" type="number" step="0.01" min="0" placeholder="0.00" required autocomplete="nope">
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="field">
                            <label>Duration (months) <span class="req">*</span></label>
                            <input class="form-input" name="durationMonths" type="number" min="1" placeholder="1" required autocomplete="nope">
                        </div>
                        <div class="field">
                            <label>Description <span style="font-weight:400;color:var(--stone-400)">(optional)</span></label>
                            <input class="form-input" name="description" placeholder="e.g. Full gym access + classes" autocomplete="nope">
                        </div>
                    </div>
                </div>

                <div class="reg-actions">
                    <a href="/admin/plans" class="btn btn-secondary" style="text-decoration:none">Cancel</a>
                    <button type="submit" class="btn" style="display:flex;align-items:center;gap:7px;min-width:140px;justify-content:center">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Save plan
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>
</body></html>
