<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" spellcheck="false">
<head><meta charset="UTF-8"><title>New PT Package — Forge</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="dashboard">
    <div th:replace="~{fragments/layout :: adminSidebar('pt-packages')}"></div>
    <div th:replace="~{fragments/layout :: topbar('')}"></div>
    <main class="main">
        <div class="add-wrap">

            <div style="margin-bottom:28px">
                <div class="pg-breadcrumb">PT Packages / New package</div>
                <h1 class="pg-heading" style="margin-bottom:0">New PT package</h1>
            </div>

            <form autocomplete="off" method="post" action="/admin/pt-packages">
                <input type="hidden" name="_csrf" th:value="${csrfToken}" autocomplete="nope">

                <div class="reg-section">
                    <div class="sec-header">
                        <div class="sec-num">01</div>
                        <div class="sec-header-text">
                            <h3>Package details</h3>
                            <p>Personal training sessions bundled at a fixed price.</p>
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="field">
                            <label>Package name <span class="req">*</span></label>
                            <input class="form-input" name="name" required placeholder="e.g. Starter 10-Pack" autocomplete="nope">
                        </div>
                        <div class="field">
                            <label>Sessions included <span class="req">*</span></label>
                            <input class="form-input" name="sessions" type="number" min="1" required placeholder="e.g. 10" autocomplete="nope">
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="field">
                            <label>Price ($) <span class="req">*</span></label>
                            <input class="form-input" name="price" type="number" step="0.01" min="0" required placeholder="e.g. 199.00" autocomplete="nope">
                        </div>
                        <div class="field">
                            <label>Description <span style="font-weight:400;color:var(--stone-400)">(optional)</span></label>
                            <input class="form-input" name="description" placeholder="Short description" autocomplete="nope">
                        </div>
                    </div>
                </div>

                <div class="reg-actions">
                    <a href="/admin/pt-packages" class="btn btn-secondary" style="text-decoration:none">Cancel</a>
                    <button type="submit" class="btn" style="display:flex;align-items:center;gap:7px;min-width:160px;justify-content:center">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Create package
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>
</body></html>
