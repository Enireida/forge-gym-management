<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" spellcheck="false">
<head>
    <meta charset="UTF-8">
    <title>Change Password - Forge</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .pw-card { max-width: 480px; }
        .strength-bar { height: 4px; border-radius: 2px; background: var(--line-1); margin-top: 6px; overflow: hidden; }
        .strength-fill { height: 100%; width: 0; border-radius: 2px; transition: width .3s, background .3s; }
    </style>
</head>
<body>
<div class="dashboard">

    <!-- Sidebar, chosen based on portalBack -->
    <div th:if="${portalBack == '/admin'}"    th:replace="~{fragments/layout :: adminSidebar('change-password')}"></div>
    <div th:if="${portalBack == '/trainer'}"  th:replace="~{fragments/layout :: trainerSidebar('change-password')}"></div>
    <div th:if="${portalBack == '/client'}"   th:replace="~{fragments/layout :: clientSidebar('change-password')}"></div>

    <div th:replace="~{fragments/layout :: topbar('Change Password')}"></div>

    <main class="main">
        <div class="card pw-card">
            <div class="card-title">Change your password</div>

            <!-- Flash messages -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

            <form method="post" th:action="${portalBack + '/change-password'}" autocomplete="off">
                <input type="hidden" name="_csrf" th:value="${csrfToken}" autocomplete="nope">

                <div style="margin-bottom:14px">
                    <label class="form-label">Current password</label>
                    <input class="form-input" type="password" name="currentPassword" required
                           autocomplete="current-password">
                </div>

                <div style="margin-bottom:14px">
                    <label class="form-label">New password</label>
                    <input class="form-input" type="password" name="newPassword" id="newPw"
                           required minlength="6" autocomplete="new-password"
                           oninput="checkStrength(this.value)">
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                    <span id="strengthLabel" style="font-size:11px;color:var(--stone-400);margin-top:3px;display:block"></span>
                </div>

                <div style="margin-bottom:22px">
                    <label class="form-label">Confirm new password</label>
                    <input class="form-input" type="password" name="confirmPassword" id="confirmPw"
                           required autocomplete="new-password"
                           oninput="checkMatch()">
                    <span id="matchLabel" style="font-size:11px;margin-top:3px;display:block"></span>
                </div>

                <div style="display:flex;gap:10px;align-items:center">
                    <button class="btn" type="submit">Update Password</button>
                    <a class="btn btn-secondary" th:href="${portalBack}">Cancel</a>
                </div>
            </form>
        </div>

        <!-- Tips card -->
        <div class="card pw-card" style="margin-top:0">
            <div class="card-title" style="font-size:14px;margin-bottom:10px">Password tips</div>
            <ul style="font-size:13px;color:var(--stone-500);line-height:1.8;margin:0;padding-left:18px">
                <li>At least <strong>6 characters</strong> long</li>
                <li>Mix letters, numbers and symbols</li>
                <li>Avoid using your name or email</li>
                <li>Never share your password with anyone</li>
            </ul>
        </div>
    </main>
</div>

<script>
    function checkStrength(val) {
        const fill  = document.getElementById('strengthFill');
        const label = document.getElementById('strengthLabel');
        let score = 0;
        if (val.length >= 6)  score++;
        if (val.length >= 10) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^a-zA-Z0-9]/.test(val)) score++;

        const colors = ['#e55', '#e99', '#f5a623', '#3cba54'];
        const labels = ['Too short', 'Weak', 'Fair', 'Strong'];
        const pct    = [20, 40, 70, 100];

        if (val.length === 0) { fill.style.width = '0'; label.textContent = ''; return; }
        const i = Math.min(score, 3);
        fill.style.width     = pct[i] + '%';
        fill.style.background = colors[i];
        label.textContent    = labels[i];
        label.style.color    = colors[i];
    }

    function checkMatch() {
        const np  = document.getElementById('newPw').value;
        const cp  = document.getElementById('confirmPw').value;
        const lbl = document.getElementById('matchLabel');
        if (!cp) { lbl.textContent = ''; return; }
        if (np === cp) {
            lbl.textContent = '✓ Passwords match';
            lbl.style.color = '#3cba54';
        } else {
            lbl.textContent = '✗ Passwords do not match';
            lbl.style.color = '#e55';
        }
    }
</script>
</body>
</html>
